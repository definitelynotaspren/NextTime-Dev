# The app stack: Nextcloud (with NextTime mounted from this folder) and Redis.
#
# The database is NOT here. It is its own stack (docker/data/docker-compose.yml) so that nothing
# you do to this folder or these containers can touch it. Start the data stack first:
# `make docker-up` does both. See docs/isolated-data.md.

services:
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    networks:
      - timebank_network

  nextcloud:
    build: .
    restart: always
    ports:
      - "${NEXTCLOUD_PORT:-8080}:80"
    volumes:
      - nextcloud_data:/var/www/html
      - ./:/var/www/html/custom_apps/timebank:ro
    environment:
      POSTGRES_HOST: ${NEXTTIME_DB_HOST:-nexttime-db}
      POSTGRES_DB: ${NEXTTIME_DB_NAME:-${POSTGRES_DB:-nextcloud}}
      POSTGRES_USER: ${POSTGRES_USER:-nextcloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      REDIS_HOST: redis
      REDIS_HOST_PASSWORD: ${REDIS_PASSWORD:-changeme}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:-admin}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_TRUSTED_DOMAINS:-localhost}
      OVERWRITEPROTOCOL: ${OVERWRITE_PROTOCOL:-http}
      PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-512M}
      PHP_UPLOAD_LIMIT: ${PHP_UPLOAD_LIMIT:-512M}
    depends_on:
      - redis
    networks:
      - timebank_network
      - nexttime_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/status.php"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  # Nextcloud's own folder: config.php (its secrets and the database password), uploaded files such
  # as claim evidence. External for the same reason as the database: created once with
  # `make docker-data-init`, never deleted by Compose.
  nextcloud_data:
    external: true
    name: ${NEXTTIME_FILES_VOLUME:-nexttime_files}

networks:
  timebank_network:
    driver: bridge
  # Created by the data stack; this stack only joins it.
  nexttime_data:
    external: true
    name: nexttime_data
