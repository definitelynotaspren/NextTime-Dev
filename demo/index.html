  <style>
    /* ── Design tokens ── */
    :root {
      --primary:        #0082c9;
      --primary-hover:  #006aa3;
      --primary-text:   #ffffff;
      --success:        #46ba61;
      --warning:        #e9b513;
      --error:          #e9322d;
      --bg:             #f2f2f2;
      --bg-hover:       #e8e8e8;
      --bg-dark:        #555555;
      --surface:        #ffffff;
      --border:         #dbdbdb;
      --text:           #222222;
      --text-light:     #767676;
      --sidebar-width:  220px;
      --radius:         8px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
           background: var(--bg); color: var(--text); font-size: 14px; }

    /* ── Layout ── */
    #app { display: flex; height: 100vh; overflow: hidden; }

    .sidebar {
      width: var(--sidebar-width);
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      flex-shrink: 0; overflow-y: auto;
    }
    .sidebar-header {
      padding: 18px 16px 12px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-header h2 { font-size: 16px; font-weight: 700; color: var(--primary); }
    .sidebar-header small { color: var(--text-light); font-size: 11px; }
    .sidebar-user {
      padding: 10px 16px;
      display: flex; align-items: center; gap: 8px;
      border-bottom: 1px solid var(--border);
    }
    .avatar {
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--primary); color: white;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; flex-shrink: 0;
    }
    .user-info { min-width: 0; }
    .user-name { font-size: 13px; font-weight: 600; }
    .user-balance { font-size: 11px; color: var(--text-light); }

    nav { padding: 8px 0; flex: 1; }
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 16px; cursor: pointer;
      color: var(--text); text-decoration: none;
      border-radius: 0; transition: background 0.15s;
    }
    .nav-item:hover { background: var(--bg-hover); }
    .nav-item.active { background: var(--primary); color: white; }
    .nav-item .icon { font-size: 16px; width: 20px; text-align: center; }
    .nav-item .label { font-size: 13px; }

    .content {
      flex: 1; overflow-y: auto;
      padding: 24px;
    }

    /* ── Common UI components ── */
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    h2 { font-size: 17px; font-weight: 600; }
    h3 { font-size: 15px; font-weight: 600; }

    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 14px; border-radius: 6px; font-size: 13px;
      font-weight: 500; cursor: pointer; border: 1px solid transparent;
      transition: all 0.15s; white-space: nowrap;
    }
    .btn-primary { background: var(--primary); color: white; border-color: var(--primary); }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); border-color: var(--primary-hover); }
    .btn-default { background: var(--surface); color: var(--text); border-color: var(--border); }
    .btn-default:hover:not(:disabled) { background: var(--bg-hover); }
    .btn-danger  { background: var(--error); color: white; border-color: var(--error); }
    .btn-success { background: var(--success); color: white; border-color: var(--success); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    input, textarea, select {
      width: 100%; padding: 8px 10px; border: 1px solid var(--border);
      border-radius: 6px; font-size: 13px; font-family: inherit;
      background: var(--surface); color: var(--text);
      transition: border-color 0.15s;
    }
    input:focus, textarea:focus, select:focus {
      outline: none; border-color: var(--primary);
    }
    textarea { resize: vertical; min-height: 80px; }
    label { display: block; margin-bottom: 4px; font-weight: 500; font-size: 13px; }

    .form-group { margin-bottom: 14px; }
    .form-row { display: flex; gap: 14px; }
    .form-row .form-group { flex: 1; }
    .form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 8px; border-radius: 4px;
      font-size: 11px; text-transform: uppercase; font-weight: 600;
    }
    .badge-open    { background: var(--success); color: white; }
    .badge-progress { background: var(--warning); color: white; }
    .badge-completed { background: var(--bg-dark); color: white; }
    .badge-pending  { background: var(--primary); color: white; }
    .badge-approved { background: var(--success); color: white; }
    .badge-rejected { background: var(--error); color: white; }
    .badge-voting   { background: var(--warning); color: white; }
    .badge-urgent   { background: var(--error); color: white; }
    .badge-normal   { background: var(--primary); color: white; }
    .badge-flexible { background: var(--success); color: white; }
    .badge-cat      { background: var(--bg-hover); color: var(--text); }

    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px;
    }

    .empty-state {
      text-align: center; padding: 40px 20px;
      color: var(--text-light);
      background: var(--bg-hover); border-radius: var(--radius);
    }
    .empty-state .icon { font-size: 40px; margin-bottom: 12px; }

    .alert { padding: 10px 14px; border-radius: 6px; margin-bottom: 14px; font-size: 13px; }
    .alert-success { background: #d7f5df; color: #1a5c2a; border: 1px solid #a5dbb5; }
    .alert-error   { background: #fde8e8; color: #7a1a1a; border: 1px solid #f5b8b8; }

    .pagination {
      display: flex; align-items: center; justify-content: center; gap: 16px;
      margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border);
    }
    .pagination span { font-size: 13px; color: var(--text-light); }

    /* ── Modal overlay ── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.45);
      display: flex; align-items: center; justify-content: center; z-index: 1000;
    }
    .modal-box {
      background: var(--surface); border-radius: var(--radius);
      padding: 24px; width: 580px; max-width: 95vw; max-height: 90vh;
      overflow-y: auto; box-shadow: 0 8px 32px rgba(0,0,0,.18);
    }
    .modal-box h2 { margin-bottom: 18px; }

    /* ── Request Card ── */
    .request-card {
      background: var(--surface); border: 2px solid var(--border);
      border-radius: var(--radius); padding: 16px; cursor: pointer;
      transition: all 0.18s;
    }
    .request-card:hover {
      border-color: var(--primary);
      box-shadow: 0 4px 14px rgba(0,0,0,.09);
      transform: translateY(-2px);
    }
    .request-card.priority-urgent { border-left: 4px solid var(--error); }
    .request-card.priority-normal { border-left: 4px solid var(--primary); }
    .request-card.priority-flexible { border-left: 4px solid var(--success); }

    .card-header { display: flex; justify-content: space-between; margin-bottom: 10px; flex-wrap: wrap; gap: 6px; }
    .card-title { font-size: 16px; font-weight: 600; margin: 6px 0; }
    .card-description { color: var(--text-light); font-size: 13px; line-height: 1.5; margin: 6px 0; }
    .card-meta {
      display: flex; flex-wrap: wrap; gap: 10px;
      margin: 10px 0; font-size: 12px; color: var(--text-light);
    }
    .meta-item { display: flex; align-items: center; gap: 4px; }
    .card-footer {
      display: flex; justify-content: space-between;
      margin-top: 10px; padding-top: 10px;
      border-top: 1px solid var(--border); font-size: 12px; color: var(--text-light);
    }

    /* ── Board ── */
    .board-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .board-filters { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; align-items: flex-end; }
    .board-filters select { width: auto; min-width: 130px; }
    .view-toggle { display: flex; gap: 8px; margin-bottom: 16px; }
    .board-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }
    .board-map { height: 560px; border-radius: var(--radius); overflow: hidden; margin-bottom: 16px; }

    /* ── Balance ── */
    .balance-hero {
      background: linear-gradient(135deg, var(--primary), #0066aa);
      color: white; padding: 36px; border-radius: var(--radius);
      text-align: center; margin-bottom: 24px;
    }
    .balance-hero h1 { color: white; font-size: 20px; opacity: .9; margin-bottom: 8px; }
    .balance-amount { font-size: 64px; font-weight: 700; line-height: 1; }
    .balance-amount span { font-size: 22px; font-weight: 400; opacity: .8; margin-left: 6px; }
    .balance-updated { margin-top: 8px; font-size: 12px; opacity: .7; }

    .tx-list { display: flex; flex-direction: column; gap: 8px; }
    .tx-item {
      background: var(--bg-hover); padding: 14px; border-radius: 6px;
      border-left: 4px solid var(--border);
    }
    .tx-item.earned { border-left-color: var(--success); }
    .tx-item.spent  { border-left-color: var(--primary); }
    .tx-item.adjusted { border-left-color: var(--warning); }
    .tx-main { display: flex; gap: 10px; margin-bottom: 6px; }
    .tx-type { font-weight: 600; min-width: 75px; }
    .tx-item.earned .tx-type { color: var(--success); }
    .tx-item.spent  .tx-type { color: var(--primary); }
    .tx-desc { flex: 1; }
    .tx-meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-light); }

    /* ── Ledger table ── */
    .ledger-table { width: 100%; border-collapse: collapse; margin-bottom: 16px; font-size: 13px; }
    .ledger-table th, .ledger-table td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); }
    .ledger-table th { background: var(--bg-hover); font-weight: 600; }
    .ledger-table tr:hover td { background: var(--bg-hover); }
    .ledger-table .hours-col { font-weight: 700; color: var(--primary); }
    .ledger-table .desc-col { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ── Claims / approvals ── */
    .claim-card {
      background: var(--bg-hover); padding: 16px; border-radius: var(--radius);
      margin-bottom: 14px;
    }
    .claim-header { display: flex; justify-content: space-between; margin-bottom: 8px; }
    .claim-hours { font-weight: 600; margin-bottom: 6px; font-size: 13px; }
    .claim-desc { color: var(--text-light); margin-bottom: 12px; font-size: 13px; }
    .claim-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    /* ── Request detail ── */
    .detail-layout { display: flex; gap: 28px; margin-top: 18px; }
    .detail-main  { flex: 2; min-width: 0; }
    .detail-sidebar { flex: 1; min-width: 260px; }
    .detail-header { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .request-meta-row { display: flex; flex-wrap: wrap; gap: 16px; color: var(--text-light); margin: 10px 0 18px; font-size: 13px; }
    .description-box { background: var(--bg-hover); padding: 14px; border-radius: 6px; margin-bottom: 18px; font-size: 14px; line-height: 1.6; }
    .comment { background: var(--bg-hover); padding: 12px; border-radius: 6px; margin-bottom: 8px; }
    .comment-header { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 12px; color: var(--text-light); }
    .comment p { font-size: 13px; line-height: 1.5; }
    .add-comment { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .vol-card { background: var(--surface); border: 1px solid var(--border); padding: 12px; border-radius: 6px; margin-bottom: 8px; }
    .vol-header { display: flex; justify-content: space-between; margin-bottom: 6px; }
    .vol-stats { font-size: 11px; color: var(--text-light); margin-top: 6px; display: flex; gap: 12px; }

    /* ── Submit earning ── */
    .earning-layout { display: flex; gap: 32px; }
    .earning-form { flex: 1; max-width: 480px; }
    .earning-history { flex: 1; }
    .hours-calc { margin-top: 6px; font-size: 13px; color: var(--success); }

    /* ── Misc ── */
    .section-title { margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
    .section-space { margin-bottom: 36px; }
    .subtitle { color: var(--text-light); margin-bottom: 16px; font-size: 13px; }
    .back-btn { margin-bottom: 16px; }
    .no-items { color: var(--text-light); padding: 20px; text-align: center; background: var(--bg-hover); border-radius: 6px; }
    .spinner { display: inline-block; width: 24px; height: 24px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 700px) {
      .sidebar { width: 48px; }
      .sidebar .label, .sidebar-header h2, .sidebar-header small, .sidebar-user .user-info { display: none; }
      .detail-layout, .earning-layout { flex-direction: column; }
    }
  </style>
</head>

function getCategoryById(id) {
  return CATEGORIES.find(c => c.id === id) || null;
}

function getCategoryName(id) {
  return getCategoryById(id)?.name || 'Other';
}

function fmtDate(d) {
  if (!d) return '';
  return new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function fmtDateTime(d) {
  if (!d) return '';
  return new Date(d).toLocaleString();
}

function truncate(str, max = 120) {
  if (!str) return '';
  return str.length <= max ? str : str.slice(0, max) + '…';
}

function statusBadgeClass(s) {
  if (s === 'open') return 'badge badge-open';
  if (s === 'in_progress') return 'badge badge-progress';
  if (s === 'completed') return 'badge badge-completed';
  return 'badge';
}

function priorityBadgeClass(p) {
  return `badge badge-${p}`;
}

const RequestBoard = {
  components: { RequestCard, NewRequestModal },
  setup() {
    const router = useRouter();
    const showModal = ref(false);
    const filterStatus = ref('');
    const filterCategory = ref('');
    const filterPriority = ref('');
    const viewMode = ref('grid');
    let mapInstance = null;
    const mapEl = ref(null);

    const filtered = computed(() => {
      return REQUESTS.filter(r => {
        if (filterStatus.value && r.status !== filterStatus.value) return false;
        if (filterCategory.value && String(r.categoryId) !== filterCategory.value) return false;
        if (filterPriority.value && r.priority !== filterPriority.value) return false;
        return true;
      });
    });

    function clearFilters() {
      filterStatus.value = '';
      filterCategory.value = '';
      filterPriority.value = '';
    }

    function viewRequest(id) {
      router.push({ name: 'RequestDetail', params: { id } });
    }

    // Map
    watch(viewMode, (val) => {
      if (val === 'map') nextTick(() => initMap());
      else { if (mapInstance) { mapInstance.remove(); mapInstance = null; } }
    });

    function initMap() {
      if (!mapEl.value || mapInstance) return;
      mapInstance = new maplibregl.Map({
        container: mapEl.value,
        style: 'https://demotiles.maplibre.org/style.json',
        center: [-122.68, 45.51],
        zoom: 11,
      });
      mapInstance.on('load', () => addMapMarkers());
    }

    function addMapMarkers() {
      filtered.value.forEach(req => {
        if (!req.location) return;
        const parts = req.location.split(',').map(Number);
        if (parts.length !== 2 || isNaN(parts[0])) return;
        const el = document.createElement('div');
        el.textContent = '🆘';
        el.style.cssText = 'font-size:22px;cursor:pointer;';
        const popup = new maplibregl.Popup({ offset: 20 })
          .setHTML(`<div style="padding:10px;min-width:180px"><strong>${req.title}</strong><br><small>${getCategoryName(req.categoryId)} · ${req.hoursBudget}h</small></div>`);
        new maplibregl.Marker({ element: el })
          .setLngLat([parts[1], parts[0]])
          .setPopup(popup)
          .addTo(mapInstance);
        el.addEventListener('click', () => viewRequest(req.id));
      });
    }

    onMounted(() => {});
    return { CATEGORIES, filtered, showModal, filterStatus, filterCategory, filterPriority, viewMode, mapEl, clearFilters, viewRequest };
  },
  template: `

/* ── AdminApprovals ── */
const AdminApprovals = {
  setup() {
    const pending = computed(() => EARNINGS.filter(e => e.status === 'pending'));
    const voting  = computed(() => EARNINGS.filter(e => e.status === 'voting'));
    const processing = ref(null);
    const rejectReason = ref('');
    const showRejectFor = ref(null);

    function approve(id) {
      processing.value = id;
      setTimeout(() => {
        const e = EARNINGS.find(x => x.id === id);
        if (e) e.status = 'approved';
        processing.value = null;
        BALANCE.balance = parseFloat((BALANCE.balance + (e?.actualHoursEarned || 0)).toFixed(2));
      }, 500);
    }

    function reject(id) {
      if (!rejectReason.value.trim()) return;
      processing.value = id;
      setTimeout(() => {
        const e = EARNINGS.find(x => x.id === id);
        if (e) e.status = 'rejected';
        showRejectFor.value = null;
        rejectReason.value = '';
        processing.value = null;
      }, 500);
    }

    function sendToVote(id) {
      processing.value = id;
      setTimeout(() => {
        const e = EARNINGS.find(x => x.id === id);
        if (e) e.status = 'voting';
        processing.value = null;
      }, 500);
    }

    function vote(id, decision) {
      processing.value = id;
      setTimeout(() => {
        const e = EARNINGS.find(x => x.id === id);
        if (e) {
          if (decision === 'approve') e.approveCount++;
          else e.rejectCount++;
        }
        processing.value = null;
      }, 400);
    }

    return { pending, voting, processing, rejectReason, showRejectFor, approve, reject, sendToVote, vote, fmtDate, getCategoryName };
  },
  template: `
    <div>
      <h1 style="margin-bottom:20px">Approval Dashboard</h1>

      <div class="section-space">
        <h2 class="section-title">Pending Claims ({{ pending.length }})</h2>
        <div v-if="pending.length === 0" class="no-items">No pending claims to review.</div>
        <div v-for="claim in pending" :key="claim.id" class="claim-card">
          <div class="claim-header">
            <strong>{{ claim.userId }}</strong>
            <span style="color:var(--text-light);font-size:12px">{{ fmtDate(claim.createdAt) }}</span>
          </div>
          <div class="claim-hours">{{ claim.hoursClaimed }} hrs claimed → <strong>{{ claim.actualHoursEarned.toFixed(2) }} hrs to be earned</strong></div>
          <div class="claim-desc">{{ claim.description }}</div>
          <div style="font-size:12px;color:var(--text-light);margin-bottom:10px">Category: {{ getCategoryName(claim.categoryId) }}</div>
          <div class="claim-actions">
            <button class="btn btn-success" @click="approve(claim.id)" :disabled="processing === claim.id">✓ Approve</button>
            <button class="btn btn-danger"  @click="showRejectFor = claim.id" :disabled="processing === claim.id">✗ Reject</button>
            <button class="btn btn-default" @click="sendToVote(claim.id)" :disabled="processing === claim.id">🗳 Send to Vote</button>
          </div>
          <div v-if="showRejectFor === claim.id" style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">
            <textarea v-model="rejectReason" rows="2" placeholder="Reason for rejection…"></textarea>
            <div style="display:flex;gap:8px;margin-top:8px">
              <button class="btn btn-default" @click="showRejectFor=null">Cancel</button>
              <button class="btn btn-danger" @click="reject(claim.id)" :disabled="!rejectReason.trim() || processing===claim.id">Confirm Reject</button>
            </div>
          </div>
        </div>
      </div>

      <div>
        <h2 class="section-title">In Voting ({{ voting.length }})</h2>
        <div v-if="voting.length === 0" class="no-items">No claims currently in voting.</div>
        <div v-for="claim in voting" :key="claim.id" class="claim-card">
          <div class="claim-header">
            <strong>{{ claim.userId }}</strong>
            <span style="color:var(--success)">{{ claim.approveCount }} approve</span>
            /
            <span style="color:var(--error)">{{ claim.rejectCount }} reject</span>
          </div>
          <div class="claim-hours">{{ claim.hoursClaimed }} hrs → {{ claim.actualHoursEarned.toFixed(2) }} hrs</div>
          <div class="claim-desc">{{ claim.description }}</div>
          <div class="claim-actions">
            <button class="btn btn-success" @click="vote(claim.id,'approve')" :disabled="processing===claim.id">👍 Vote Approve</button>
            <button class="btn btn-danger"  @click="vote(claim.id,'reject')"  :disabled="processing===claim.id">👎 Vote Reject</button>
          </div>
        </div>
      </div>
    </div>
  `
};

/* ── MyBalance ── */
const MyBalance = {
  setup() {
    const txList = MY_TRANSACTIONS.slice().reverse();
    return { BALANCE, txList, fmtDate, fmtDateTime };
  },
  template: `
    <div>
      <div class="balance-hero">
        <h1>My Balance</h1>
        <div class="balance-amount">{{ BALANCE.balance }}<span>hours</span></div>
        <div class="balance-updated">Last updated: {{ fmtDateTime(BALANCE.updatedAt) }}</div>
      </div>

      <h2 style="margin-bottom:14px">My Transaction History</h2>
      <div v-if="txList.length === 0" class="no-items">No transactions yet.</div>
      <div class="tx-list">
        <div v-for="tx in txList" :key="tx.id" :class="'tx-item ' + tx.transactionType">
          <div class="tx-main">
            <span class="tx-type">
              {{ tx.transactionType === 'earned' ? '+' : tx.transactionType === 'spent' ? '-' : '~' }}
              {{ tx.hours }} hrs
            </span>
            <span class="tx-desc">{{ tx.description }}</span>
          </div>
          <div class="tx-meta">
            <span v-if="tx.fromUserId && tx.toUserId">{{ tx.fromUserId }} → {{ tx.toUserId }}</span>
            <span>{{ fmtDate(tx.createdAt) }}</span>
          </div>
        </div>
      </div>
    </div>
  `
};

/* ── PublicLedger ── */
const PublicLedger = {
  setup() {
    const txList = TRANSACTIONS.slice().reverse();

    function typeIcon(t) {
      if (t === 'earned') return '➕';
      if (t === 'spent')  return '➖';
      if (t === 'adjusted') return '⚙️';
      return '🔄';
    }

    function typeBadge(t) {
      if (t === 'earned') return 'badge badge-approved';
      if (t === 'spent')  return 'badge badge-pending';
      return 'badge badge-voting';
    }

    return { txList, typeIcon, typeBadge, fmtDate };
  },
  template: `
    <div>
      <h1>Public Ledger</h1>
      <p class="subtitle">Transparent record of all community hour transactions.</p>
      <table class="ledger-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Type</th>
            <th>From</th>
            <th>To</th>
            <th>Hours</th>
            <th>Description</th>
          </tr>
        </thead>
        <tbody>
          <tr v-for="tx in txList" :key="tx.id">
            <td>{{ fmtDate(tx.createdAt) }}</td>
            <td><span :class="typeBadge(tx.transactionType)">{{ typeIcon(tx.transactionType) }} {{ tx.transactionType }}</span></td>
            <td>{{ tx.fromUserId || 'System' }}</td>
            <td>{{ tx.toUserId || 'System' }}</td>
            <td class="hours-col">{{ tx.hours }}</td>
            <td class="desc-col">{{ tx.description }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  `
};

    { path: '/balance',      name: 'MyBalance',     component: MyBalance },
  ],
});
